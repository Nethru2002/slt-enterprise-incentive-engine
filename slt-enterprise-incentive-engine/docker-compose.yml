version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: slt_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: travel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: slt_redis_cache
    ports:
      - "6379:6379"

volumes:
  pgdata: